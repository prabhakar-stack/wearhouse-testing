<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #FF6700;
      --primary-hover: #ff7f24;
      --border: #334155;
      --success: #10b981;
      --error: #ef4444;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .status-card {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 11px;
      line-height: 1.4;
    }

    .status-title {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .text-success { color: var(--success); }
    .text-error { color: var(--error); }
    .text-loading { color: var(--primary); }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h3>⚡ SmartHub Sync</h3>
  <div class="subtitle">Amazon Session Companion</div>

  <div class="form-group">
    <label for="serverUrl">Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://your-app.onrender.com" />
  </div>

  <div class="form-group">
    <label for="secretKey">Secret Key</label>
    <input type="password" id="secretKey" placeholder="SMARTHUB_PERMANENT_SECRET" />
  </div>

  <button id="saveBtn">Save Config</button>
  <button id="syncBtn" disabled style="background-color: #334155; margin-top: 8px;">Sync Session Now</button>

  <div class="status-card">
    <div class="status-title" id="statusTitle">System Status</div>
    <div id="statusMsg">Not configured. Enter credentials and click "Save".</div>
  </div>

  <div class="footer">
    Make sure you are logged in to smarthub.amazon.in
  </div>

  <script src="popup.js"></script>
</body>
</html>
