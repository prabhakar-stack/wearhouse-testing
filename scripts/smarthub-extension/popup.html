<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #FF6700;
      --primary-hover: #ff7f24;
      --border: #334155;
      --success: #10b981;
      --error: #ef4444;
      --warn: #f59e0b;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .info-grid {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      space-y: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .info-value {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      font-family: monospace;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .status-card {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 11px;
      line-height: 1.4;
    }

    .status-title {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .text-success { color: var(--success); }
    .text-error { color: var(--error); }
    .text-warn { color: var(--warn); }
    .text-loading { color: var(--primary); }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h3>⚡ SmartHub Sync</h3>
  <div class="subtitle">Zero-Config Companion</div>

  <div class="info-grid">
    <div class="info-row">
      <span class="info-label">Server URL</span>
      <span class="info-value text-warn" id="valUrl">Not Detected</span>
    </div>
    <div class="info-row">
      <span class="info-label">Token Status</span>
      <span class="info-value text-error" id="valToken">None</span>
    </div>
  </div>

  <button id="syncBtn" disabled>Sync Session Now</button>

  <div class="status-card">
    <div class="status-title" id="statusTitle">Instructions</div>
    <div id="statusMsg">Open your Warehouse Settings page, click "Capture Session", then open this popup to sync.</div>
  </div>

  <div class="footer">
    Make sure you are logged in to <b>smarthub.amazon.in</b><br>
    before syncing.
  </div>

  <script src="popup.js"></script>
</body>
</html>
